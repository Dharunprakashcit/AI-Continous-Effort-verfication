<style>
  body { margin: 0; background: #fff; font-family: Arial, Helvetica, sans-serif; }
  svg { display: block; margin: 0; background: #fff; }
  text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
  .t { font-size: 13px; font-weight: 700; }
  .s { font-size: 11px; }

<script>
const NS = "http://www.w3.org/2000/svg";
const FILL = { app: "#e8eefc", api: "#e6f4ea", db: "#fff4d6", ml: "#f3e8fd", ext: "#eeeeee", agent: "#e0f2f1", warn: "#fde8e8" };

function mk(id, w, h) {
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("id", id); svg.setAttribute("width", w); svg.setAttribute("height", h);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="${id}-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>`;
  svg.appendChild(defs);
  document.getElementById("figs").appendChild(svg);
  return svg;
}
function el(svg, tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  svg.appendChild(e); return e;
}
function box(svg, x, y, w, h, title, lines = [], fill = "#fff", opts = {}) {
  el(svg, "rect", { x, y, width: w, height: h, rx: 6, fill, stroke: opts.dash ? "#666" : "#333", "stroke-width": 1.2, "stroke-dasharray": opts.dash ? "5 3" : "" });
  el(svg, "text", { x: x + w / 2, y: y + 18, "text-anchor": "middle", class: "t" }, title);
  lines.forEach((ln, i) => el(svg, "text", { x: x + w / 2, y: y + 36 + i * 14, "text-anchor": "middle", class: "s" }, ln));
}
function group(svg, x, y, w, h, label) {
  el(svg, "rect", { x, y, width: w, height: h, rx: 8, fill: "none", stroke: "#999", "stroke-width": 1, "stroke-dasharray": "6 4" });
  el(svg, "text", { x: x + 10, y: y + 15, class: "h" }, label);
}
function arrow(svg, id, x1, y1, x2, y2, label, opts = {}) {
  el(svg, "line", { x1, y1, x2, y2, stroke: "#333", "stroke-width": 1.3, "marker-end": `url(#${id}-a)`, "marker-start": opts.both ? `url(#${id}-a)` : "" });
  if (label) el(svg, "text", { x: opts.lx ?? (x1 + x2) / 2, y: opts.ly ?? ((y1 + y2) / 2 - 4), "text-anchor": "middle", class: "l" }, label);
}
function poly(svg, id, pts, label, lx, ly) {
  el(svg, "polyline", { points: pts.map(p => p.join(",")).join(" "), fill: "none", stroke: "#333", "stroke-width": 1.3, "marker-end": `url(#${id}-a)` });
  if (label) el(svg, "text", { x: lx, y: ly, "text-anchor": "middle", class: "l" }, label);
}

  box(s, 455, 475, 130, 55, "Assignments", ["Submissions", "Contributions"], FILL.db);
  box(s, 595, 475, 130, 55, "Predictions", ["agent scores, reasons,", "faculty feedback"], FILL.db);
  box(s, 315, 545, 410, 65, "StudentAssignmentRecord", ["one row per student per assignment, 14 columns, CSV export"], FILL.db);

  group(s, 790, 340, 300, 285, "OFFLINE AML WORKFLOW");
  box(s, 805, 365, 270, 50, "train_model.py, academic_model.py", ["simulated data, training, metrics"], FILL.ml);
  box(s, 805, 425, 270, 50, "aml_pipeline.py", ["validation, CV, tuning, registry"], FILL.ml);
  box(s, 805, 485, 270, 50, "drift_monitor.py", ["live inputs against training data"], FILL.ml);
  box(s, 805, 545, 270, 65, "retrain.py", ["faculty feedback becomes labelled", "rows, then retrain and compare"], FILL.ml);

  arrow(s, id, 245, 70, 315, 57, "HTTP/JSON", { lx: 280, ly: 52 });
  arrow(s, id, 245, 140, 315, 60, "", {});
  arrow(s, id, 520, 160, 520, 175, "");
  arrow(s, id, 725, 215, 805, 65, "HTTP", { lx: 770, ly: 135 });
  arrow(s, id, 725, 370, 805, 140, "HTTP", { lx: 775, ly: 280 });
  arrow(s, id, 520, 410, 520, 450, "read and write", { lx: 520, ly: 440 });
  arrow(s, id, 940, 365, 940, 295, "writes", { lx: 965, ly: 335 });
})();

/* Fig 5: AML workflow */
(() => {
